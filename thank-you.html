<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.4.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="shortcut icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=20260202" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Thank You | Developong Company</title>
    <style>
      :root {
        --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        --color-primary: #667eea;
        --color-secondary: #764ba2;
      }

      body {
        font-family: 'Inter', 'Poppins', sans-serif;
      }

      .thankyou {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1a1a2e 0%, #2d2d44 100%);
        padding: 2rem;
        position: relative;
        overflow: hidden;
      }

      .thankyou::before {
        content: '';
        position: absolute;
        top: -100px;
        right: -100px;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(102, 126, 234, 0.2) 0%, transparent 70%);
        border-radius: 50%;
      }

      .thankyou::after {
        content: '';
        position: absolute;
        bottom: -150px;
        left: -100px;
        width: 500px;
        height: 500px;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
        border-radius: 50%;
      }

      .thankyou__card {
        background: rgba(255, 255, 255, 0.95);
        border-radius: 24px;
        padding: 3rem 2.5rem;
        text-align: center;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.25);
        position: relative;
        z-index: 1;
      }

      .thankyou__icon {
        width: 100px;
        height: 100px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 2rem;
        animation: pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.4);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 0 20px rgba(102, 126, 234, 0);
        }
      }

      .thankyou__icon i {
        font-size: 3rem;
        color: #fff;
      }

      .thankyou__card h1 {
        font-size: 2.5rem;
        font-weight: 800;
        color: #1a1a2e;
        margin-bottom: 1rem;
        letter-spacing: -0.03em;
      }

      .thankyou__card h1 span {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .thankyou__card p {
        color: #64748b;
        font-size: 1.1rem;
        line-height: 1.7;
        margin-bottom: 1.5rem;
      }

      .thankyou__highlight {
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        border-radius: 12px;
        padding: 1.25rem;
        margin-bottom: 2rem;
        border-left: 4px solid #667eea;
      }

      .thankyou__highlight p {
        margin: 0;
        font-size: 1rem;
        color: #1a1a2e;
        font-weight: 500;
      }

      .thankyou__highlight i {
        color: #667eea;
        margin-right: 0.5rem;
      }

      .thankyou__btn {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        padding: 1rem 2rem;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
      }

      .thankyou__btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 30px rgba(102, 126, 234, 0.5);
      }

      .thankyou__btn i {
        transition: transform 0.3s ease;
      }

      .thankyou__btn:hover i {
        transform: translateX(-4px);
      }

      .thankyou__social {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid #e8ecf3;
      }

      .thankyou__social p {
        font-size: 0.9rem;
        color: #94a3b8;
        margin-bottom: 1rem;
      }

      .thankyou__social-links {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
      }

      .thankyou__social-link {
        width: 44px;
        height: 44px;
        background: #f8fafc;
        border: 1px solid #e8ecf3;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #64748b;
        font-size: 1.2rem;
        transition: all 0.3s ease;
      }

      .thankyou__social-link:hover {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        border-color: transparent;
        transform: translateY(-3px);
      }

      @media (max-width: 480px) {
        .thankyou__card {
          padding: 2rem 1.5rem;
        }

        .thankyou__card h1 {
          font-size: 1.8rem;
        }

        .thankyou__icon {
          width: 80px;
          height: 80px;
        }

        .thankyou__icon i {
          font-size: 2.5rem;
        }
      }
    </style>
  </head>
  <body>
    <section class="thankyou">
      <div class="thankyou__card">
        <div class="thankyou__icon">
          <i class="ri-checkbox-circle-line"></i>
        </div>
        
        <h1>Thank <span>You!</span></h1>
        
        <p>Your message has been received successfully. We appreciate you reaching out to us.</p>
        
        <div class="thankyou__highlight">
          <p><i class="ri-time-line"></i> We will get back to you within 24 hours.</p>
        </div>
        
        <p>In the meantime, feel free to explore our services or connect with us on social media.</p>
        
        <a href="Home.html" class="thankyou__btn">
          <i class="ri-arrow-left-line"></i> Back to Home
        </a>
        
        <div class="thankyou__social">
          <p>Follow us on social media</p>
          <div class="thankyou__social-links">
            <a href="#" class="thankyou__social-link" title="Facebook"><i class="ri-facebook-fill"></i></a>
            <a href="#" class="thankyou__social-link" title="Twitter"><i class="ri-twitter-x-fill"></i></a>
            <a href="#" class="thankyou__social-link" title="LinkedIn"><i class="ri-linkedin-fill"></i></a>
            <a href="#" class="thankyou__social-link" title="Instagram"><i class="ri-instagram-line"></i></a>
            <a href="#" class="thankyou__social-link" title="WhatsApp"><i class="ri-whatsapp-line"></i></a>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
